<!DOCTYPE html>
<!-- DISPATCH QUICK ADD — companion page, v2.1.0. Adds one task to the shared Dispatch cloud bin. -->
<!-- v2.1.0: added "Start this task on hold" option matching Dispatch's Hold controls (1hr/4hr, Days/Weeks stepper, specific day) -->
<!-- v2.0.1: new tasks now stamp updatedAt, for consistency with Dispatch's fetch-merge-push sync logic -->
<!-- v2.0.0: exposes all task fields (notes, priority, difficulty, minutes, due/daily/weekly, tags) instead of title-only -->
<!-- v1.1.0: favicon now matches Dispatch's icon (D mark) instead of the + mark -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dispatch — Quick Add</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23E2A63B'/%3E%3Cstop offset='1' stop-color='%23C1523D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2312161B'/%3E%3Crect x='6' y='6' width='52' height='52' rx='10' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='monospace' font-weight='700' font-size='30' fill='%2312161B' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161B; --panel:#1A2029; --panel2:#212836; --border:#2C3542;
    --text:#E9E6DE; --dim:#8B93A1; --faint:#566173;
    --amber:#E2A63B; --teal:#4E9E97; --red:#C1523D;
    --p1:#4E9E97; --p2:#6FA96B; --p3:#E2A63B; --p4:#D98A3D; --p5:#C1523D;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background-image: radial-gradient(circle at 20% 10%, rgba(78,158,151,0.07), transparent 45%), radial-gradient(circle at 85% 90%, rgba(226,166,59,0.06), transparent 45%);
  }
  .card{ width:100%; max-width:460px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:26px; }
  .field{ margin-bottom:16px; }
  .field-label{ display:block; font-size:11px; color:var(--dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em; }
  .notes-input{ width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:13px; padding:10px 12px; resize:vertical; min-height:60px; }
  .notes-input:focus{ outline:none; border-color:var(--teal); }
  .num-input, .date-input{ width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:13px; padding:10px 12px; }
  .num-input:focus, .date-input:focus{ outline:none; border-color:var(--teal); }
  .tags-input{ width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:13px; padding:10px 12px; }
  .tags-input:focus{ outline:none; border-color:var(--teal); }

  .priority-stack{ display:flex; flex-direction:column; gap:5px; }
  .priority-btn{ display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--border); border-radius:5px; padding:9px 12px; font-size:13px; font-weight:700; text-align:left; }
  .priority-btn::before{ content:''; width:8px; height:8px; border-radius:50%; background:currentColor; flex-shrink:0; opacity:0.55; }
  .priority-btn.selected{ background:rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1.5px currentColor; }
  .priority-btn.selected::before{ opacity:1; }

  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; }
  #difficultyGauge{ width:100%; max-width:220px; height:auto; overflow:visible; }
  .gauge-seg{ fill:currentColor; opacity:0.28; stroke:var(--border); stroke-width:1; cursor:pointer; }
  .gauge-seg.selected{ opacity:1; stroke:currentColor; }
  .gauge-num{ fill:var(--dim); font-family:'JetBrains Mono',monospace; font-size:14px; text-anchor:middle; pointer-events:none; }
  .gauge-num.selected{ fill:#171310; font-weight:700; }
  .gauge-labels{ display:flex; justify-content:space-between; align-items:center; width:100%; max-width:190px; margin-top:-4px; }
  .gauge-side{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--faint); }
  .gauge-current{ font-size:17px; font-weight:700; }

  .due-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .due-header .field-label{ margin-bottom:0; }
  .recur-toggles{ display:flex; align-items:center; gap:10px; }
  .daily-toggle{ display:flex; align-items:center; gap:4px; font-size:10px; color:var(--teal); text-transform:uppercase; letter-spacing:0.06em; cursor:pointer; }
  .daily-toggle input{ width:auto; accent-color:var(--teal); }
  .weekday-picker{ display:flex; gap:5px; margin-top:8px; }
  .weekday-btn{ flex:1; background:var(--panel2); border:1px solid var(--border); border-radius:5px; padding:9px 0; font-size:11.5px; font-weight:700; color:var(--dim); text-align:center; }
  .weekday-btn.selected{ background:rgba(78,158,151,0.18); border-color:var(--teal); color:var(--teal); }
  .checkbox-label{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); cursor:pointer; }
  .checkbox-label input{ width:auto; accent-color:var(--teal); }
  .or-divider{ display:flex; align-items:center; gap:8px; color:var(--faint); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; margin:10px 0; }
  .or-divider::before, .or-divider::after{ content:''; flex:1; height:1px; background:var(--border); }
  .hold-quick-btn{ background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:9px; border-radius:5px; font-size:12px; text-align:center; }
  .hold-quick-btn.active{ background:var(--teal); border-color:var(--teal); color:#0d1a19; font-weight:700; }
  .hold-unit-btn{ flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--faint); padding:7px; border-radius:5px; font-size:11.5px; font-weight:600; text-align:center; }
  .hold-unit-btn.selected{ background:rgba(78,158,151,0.18); border-color:var(--teal); color:var(--teal); font-weight:700; }
  .hold-stepper{ display:flex; align-items:center; justify-content:center; gap:14px; background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:8px; margin-bottom:12px; }
  .hold-stepper button{ width:24px; height:24px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:5px; font-size:14px; }
  .hold-summary{ display:none; background:rgba(226,166,59,0.08); border:1px solid rgba(226,166,59,0.35); border-radius:5px; padding:9px 11px; font-size:12px; color:var(--amber); margin-bottom:4px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .brand-mark{ width:32px; height:32px; border-radius:6px; background:linear-gradient(135deg,var(--amber),var(--red)); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; color:#12161B; font-size:17px; }
  .brand h1{ font-size:16px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; }
  .brand .tag{ font-size:10.5px; color:var(--faint); font-family:'JetBrains Mono',monospace; }

  #addForm{ display:none; }
  #addForm.show{ display:block; }
  .task-input{ width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:16px; padding:14px 14px; margin-bottom:12px; }
  .task-input:focus{ outline:none; border-color:var(--amber); }
  .add-btn{ width:100%; background:var(--amber); border:none; color:#171310; font-weight:700; font-size:14px; padding:13px; border-radius:7px; }
  .add-btn:active{ transform:scale(0.98); }
  .add-btn:disabled{ opacity:0.5; }
  .hint{ font-size:11px; color:var(--faint); margin-top:12px; text-align:center; }
  .confirm{ display:none; align-items:center; gap:8px; background:rgba(78,158,151,0.12); border:1px solid var(--teal); color:var(--teal); border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .confirm.show{ display:flex; }
  .error{ display:none; background:rgba(193,82,61,0.12); border:1px solid var(--red); color:var(--red); border-radius:6px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; }
  .error.show{ display:block; }
  .reconfig{ text-align:center; margin-top:18px; }
  .reconfig a{ font-size:11px; color:var(--faint); text-decoration:underline; cursor:pointer; }

  #setupForm{ display:none; }
  #setupForm.show{ display:block; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; color:var(--dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.05em; }
  .field input{ width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:10px 11px; border-radius:6px; font-size:13px; }
  .field input:focus{ outline:none; border-color:var(--teal); }
  .setup-note{ font-size:12px; color:var(--dim); line-height:1.5; margin-bottom:16px; }
  .setup-note a{ color:var(--teal); }
  .save-btn{ width:100%; background:var(--teal); border:none; color:#0d1a19; font-weight:700; font-size:13.5px; padding:12px; border-radius:7px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark">+</div>
    <div>
      <h1>Quick Add</h1>
      <div class="tag">for Dispatch</div>
    </div>
  </div>

  <div id="setupForm">
    <div class="setup-note">
      Connect this page to the same <a href="https://jsonbin.io" target="_blank" rel="noopener">JSONBin.io</a> bin your Dispatch app syncs to. Use a scoped Access Key (Read + Update only) — stored only on this device.
    </div>
    <div class="field"><label>Access Key</label><input type="password" id="setupKey" placeholder="$2a$..."></div>
    <div class="field"><label>Bin ID</label><input type="text" id="setupBin" placeholder="paste the same Bin ID as Dispatch"></div>
    <div class="error" id="setupError"></div>
    <button class="save-btn" id="setupSaveBtn" type="button">Connect</button>
  </div>

  <div id="addForm">
    <div class="confirm" id="confirmMsg">✓ Added to your queue</div>
    <div class="error" id="addError"></div>

    <div class="field">
      <input type="text" class="task-input" id="taskInput" placeholder="What needs doing?" autocomplete="off">
    </div>

    <div class="field">
      <label class="field-label">Notes</label>
      <textarea class="notes-input" id="notesInput" placeholder="Optional context…"></textarea>
    </div>

    <div class="row2">
      <div class="field">
        <label class="field-label">Priority</label>
        <div class="priority-stack" id="priorityStack">
          <button type="button" class="priority-btn" data-p="1" style="color:var(--p5)">Top</button>
          <button type="button" class="priority-btn" data-p="2" style="color:var(--p4)">High</button>
          <button type="button" class="priority-btn selected" data-p="3" style="color:var(--p3)">Medium</button>
          <button type="button" class="priority-btn" data-p="4" style="color:var(--p2)">Low</button>
          <button type="button" class="priority-btn" data-p="5" style="color:var(--p1)">Whatevs</button>
        </div>
        <input type="hidden" id="fPriority" value="3">
      </div>
      <div class="field">
        <label class="field-label">Difficulty</label>
        <div class="gauge-wrap">
          <svg id="difficultyGauge" viewBox="0 0 200 112"></svg>
          <div class="gauge-labels">
            <span class="gauge-side">Easy</span>
            <span class="gauge-current" id="difficultyNum">3</span>
            <span class="gauge-side">Hard</span>
          </div>
        </div>
        <input type="hidden" id="fDifficulty" value="3">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label class="field-label">Minutes</label>
        <input type="number" class="num-input" id="fTime" value="30" min="5" step="5">
      </div>
      <div class="field" id="dueDateField">
        <div class="due-header">
          <label class="field-label" id="dueDateLabel">Due date</label>
          <div class="recur-toggles">
            <label class="daily-toggle"><input type="checkbox" id="fWeekly"> WEEKLY</label>
            <label class="daily-toggle"><input type="checkbox" id="fDaily"> DAILY</label>
          </div>
        </div>
        <input type="date" class="date-input" id="fDue">
        <div class="weekday-picker" id="weekdayPicker" style="display:none;">
          <button type="button" class="weekday-btn" data-day="0">S</button>
          <button type="button" class="weekday-btn" data-day="1">M</button>
          <button type="button" class="weekday-btn" data-day="2">T</button>
          <button type="button" class="weekday-btn" data-day="3">W</button>
          <button type="button" class="weekday-btn" data-day="4">T</button>
          <button type="button" class="weekday-btn" data-day="5">F</button>
          <button type="button" class="weekday-btn" data-day="6">S</button>
        </div>
        <input type="hidden" id="fWeeklyDays" value="0">
      </div>
    </div>

    <div class="field">
      <label class="field-label">Tags</label>
      <input type="text" class="tags-input" id="fTags" placeholder="comma, separated">
    </div>

    <div style="border-top:1px solid var(--border); padding-top:14px; margin-top:2px; margin-bottom:16px;">
      <label class="checkbox-label" style="margin-bottom:14px; font-weight:600;"><input type="checkbox" id="fStartOnHold"> Start this task on hold</label>
      <input type="hidden" id="fHoldMethod" value="">
      <div id="startHoldOptions" style="display:none;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px;">
          <button type="button" class="hold-quick-btn" id="taskHold60Btn">1 hour</button>
          <button type="button" class="hold-quick-btn" id="taskHold240Btn">4 hours</button>
        </div>
        <div class="or-divider">hold for a stretch</div>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
          <button type="button" class="hold-unit-btn selected" id="taskHoldUnitDaysBtn">Days</button>
          <button type="button" class="hold-unit-btn" id="taskHoldUnitWeeksBtn">Weeks</button>
        </div>
        <div class="hold-stepper">
          <button type="button" id="taskHoldStepDown">−</button>
          <span style="font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:var(--amber);" id="taskHoldStepValue">2</span>
          <button type="button" id="taskHoldStepUp">+</button>
          <span style="font-size:11px; color:var(--dim);" id="taskHoldStepUnitLabel">days</span>
        </div>
        <div class="or-divider">or pick a specific day</div>
        <div class="field"><input type="date" class="date-input" id="taskHoldSpecificDay"></div>
        <div class="hold-summary" id="taskHoldSummary"></div>
      </div>
    </div>

    <button class="add-btn" id="addBtn" type="button">Add Task</button>
    <div class="reconfig"><a id="reconfigLink">Reconnect to a different bin</a></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const KEY_STORAGE = 'dispatch-cloud-key';
  const BIN_STORAGE = 'dispatch-cloud-bin';

  function getConfig(){
    const key = localStorage.getItem(KEY_STORAGE) || '';
    const binId = localStorage.getItem(BIN_STORAGE) || '';
    return (key && binId) ? { key, binId } : null;
  }
  function setConfig(key, binId){
    if(key && binId){
      localStorage.setItem(KEY_STORAGE, key);
      localStorage.setItem(BIN_STORAGE, binId);
    } else {
      localStorage.removeItem(KEY_STORAGE);
      localStorage.removeItem(BIN_STORAGE);
    }
  }

  async function jsonbinErrorDetail(res){
    try{
      const body = await res.json();
      return body && body.message ? body.message : '';
    }catch(e){ return ''; }
  }

  async function fetchTasks(cfg){
    const res = await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}/latest?meta=false`, {
      headers: { 'X-Access-Key': cfg.key }
    });
    if(!res.ok){
      const detail = await jsonbinErrorDetail(res);
      throw new Error(`fetch failed: ${res.status}${detail ? ' — ' + detail : ''}`);
    }
    const data = await res.json();
    const record = data && data.record ? data.record : data;
    return Array.isArray(record.tasks) ? record.tasks : [];
  }
  async function pushTasks(cfg, taskArray){
    const res = await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Access-Key': cfg.key },
      body: JSON.stringify({ tasks: taskArray })
    });
    if(!res.ok){
      const detail = await jsonbinErrorDetail(res);
      throw new Error(`push failed: ${res.status}${detail ? ' — ' + detail : ''}`);
    }
  }

  function showSetup(){
    document.getElementById('setupForm').classList.add('show');
    document.getElementById('addForm').classList.remove('show');
    const cfg = getConfig();
    document.getElementById('setupKey').value = cfg ? cfg.key : '';
    document.getElementById('setupBin').value = cfg ? cfg.binId : '';
  }
  function showAdd(){
    document.getElementById('setupForm').classList.remove('show');
    document.getElementById('addForm').classList.add('show');
    document.getElementById('taskInput').focus();
  }

  document.getElementById('setupSaveBtn').addEventListener('click', async ()=>{
    const key = document.getElementById('setupKey').value.trim();
    const binId = document.getElementById('setupBin').value.trim();
    const errEl = document.getElementById('setupError');
    errEl.classList.remove('show');
    if(!key || !binId){
      errEl.textContent = 'Both an Access Key and a Bin ID are required.';
      errEl.classList.add('show');
      return;
    }
    try{
      await fetchTasks({ key, binId });
    }catch(e){
      errEl.textContent = 'Could not connect — ' + e.message;
      errEl.classList.add('show');
      return;
    }
    setConfig(key, binId);
    showAdd();
  });

  document.getElementById('reconfigLink').addEventListener('click', showSetup);

  /* ---- Start on hold ---- */
  let taskHoldStepperUnit = 'days';
  let taskHoldStepperValue = 2;
  const taskHoldStepperBounds = { days: [1,6], weeks: [1,4] };

  function updateTaskHoldStepperUI(){
    document.getElementById('taskHoldUnitDaysBtn').classList.toggle('selected', taskHoldStepperUnit === 'days');
    document.getElementById('taskHoldUnitWeeksBtn').classList.toggle('selected', taskHoldStepperUnit === 'weeks');
    document.getElementById('taskHoldStepValue').textContent = taskHoldStepperValue;
    document.getElementById('taskHoldStepUnitLabel').textContent = taskHoldStepperUnit;
  }
  function updateTaskHoldSummary(){
    const method = document.getElementById('fHoldMethod').value;
    const el = document.getElementById('taskHoldSummary');
    if(!method){ el.style.display = 'none'; return; }
    let text = '';
    if(method === 'quick60') text = 'Will be added on hold, resuming in 1 hour';
    else if(method === 'quick240') text = 'Will be added on hold, resuming in 4 hours';
    else if(method === 'stretch') text = `Will be added on hold, resuming in ${taskHoldStepperValue} ${taskHoldStepperUnit}`;
    else if(method === 'specific'){
      const val = document.getElementById('taskHoldSpecificDay').value;
      text = val ? `Will be added on hold, resuming ${val}` : 'Pick a day to resume';
    }
    el.textContent = text;
    el.style.display = 'block';
  }
  function localDateKey(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function resolveTaskHoldFields(){
    const method = document.getElementById('fHoldMethod').value;
    if(method === 'quick60') return { status:'onhold', holdUntil: new Date(Date.now()+60*60000).toISOString(), holdUntilDay: null };
    if(method === 'quick240') return { status:'onhold', holdUntil: new Date(Date.now()+240*60000).toISOString(), holdUntilDay: null };
    if(method === 'stretch'){
      const days = taskHoldStepperUnit === 'weeks' ? taskHoldStepperValue * 7 : taskHoldStepperValue;
      const d = new Date(); d.setDate(d.getDate() + days);
      return { status:'onhold', holdUntil: null, holdUntilDay: localDateKey(d) };
    }
    if(method === 'specific'){
      const val = document.getElementById('taskHoldSpecificDay').value;
      if(!val) return null;
      return { status:'onhold', holdUntil: null, holdUntilDay: val };
    }
    return null;
  }
  function resetHoldSection(){
    document.getElementById('fStartOnHold').checked = false;
    document.getElementById('startHoldOptions').style.display = 'none';
    document.getElementById('fHoldMethod').value = '';
    document.getElementById('taskHoldSpecificDay').value = '';
    taskHoldStepperUnit = 'days';
    taskHoldStepperValue = 2;
    document.getElementById('taskHold60Btn').classList.remove('active');
    document.getElementById('taskHold240Btn').classList.remove('active');
    updateTaskHoldStepperUI();
    updateTaskHoldSummary();
  }
  document.getElementById('fStartOnHold').addEventListener('change', e=>{
    document.getElementById('startHoldOptions').style.display = e.target.checked ? 'block' : 'none';
  });
  document.getElementById('taskHold60Btn').addEventListener('click', ()=>{
    document.getElementById('fHoldMethod').value = 'quick60';
    document.getElementById('taskHold60Btn').classList.add('active');
    document.getElementById('taskHold240Btn').classList.remove('active');
    updateTaskHoldSummary();
  });
  document.getElementById('taskHold240Btn').addEventListener('click', ()=>{
    document.getElementById('fHoldMethod').value = 'quick240';
    document.getElementById('taskHold240Btn').classList.add('active');
    document.getElementById('taskHold60Btn').classList.remove('active');
    updateTaskHoldSummary();
  });
  document.getElementById('taskHoldUnitDaysBtn').addEventListener('click', ()=>{
    taskHoldStepperUnit = 'days';
    const [min,max] = taskHoldStepperBounds.days;
    taskHoldStepperValue = Math.min(Math.max(taskHoldStepperValue, min), max);
    document.getElementById('fHoldMethod').value = 'stretch';
    document.getElementById('taskHold60Btn').classList.remove('active');
    document.getElementById('taskHold240Btn').classList.remove('active');
    updateTaskHoldStepperUI();
    updateTaskHoldSummary();
  });
  document.getElementById('taskHoldUnitWeeksBtn').addEventListener('click', ()=>{
    taskHoldStepperUnit = 'weeks';
    const [min,max] = taskHoldStepperBounds.weeks;
    taskHoldStepperValue = Math.min(Math.max(taskHoldStepperValue, min), max);
    document.getElementById('fHoldMethod').value = 'stretch';
    document.getElementById('taskHold60Btn').classList.remove('active');
    document.getElementById('taskHold240Btn').classList.remove('active');
    updateTaskHoldStepperUI();
    updateTaskHoldSummary();
  });
  document.getElementById('taskHoldStepDown').addEventListener('click', ()=>{
    const [min] = taskHoldStepperBounds[taskHoldStepperUnit];
    if(taskHoldStepperValue > min) taskHoldStepperValue--;
    document.getElementById('fHoldMethod').value = 'stretch';
    updateTaskHoldStepperUI();
    updateTaskHoldSummary();
  });
  document.getElementById('taskHoldStepUp').addEventListener('click', ()=>{
    const [,max] = taskHoldStepperBounds[taskHoldStepperUnit];
    if(taskHoldStepperValue < max) taskHoldStepperValue++;
    document.getElementById('fHoldMethod').value = 'stretch';
    updateTaskHoldStepperUI();
    updateTaskHoldSummary();
  });
  document.getElementById('taskHoldSpecificDay').addEventListener('change', ()=>{
    document.getElementById('fHoldMethod').value = 'specific';
    document.getElementById('taskHold60Btn').classList.remove('active');
    document.getElementById('taskHold240Btn').classList.remove('active');
    updateTaskHoldSummary();
  });

  /* ---- Priority pills ---- */
  function setPriority(p){
    document.getElementById('fPriority').value = p;
    document.querySelectorAll('.priority-btn').forEach(b=>{
      b.classList.toggle('selected', Number(b.dataset.p) === p);
    });
  }
  document.querySelectorAll('.priority-btn').forEach(b=>{
    b.addEventListener('click', ()=> setPriority(Number(b.dataset.p)));
  });

  /* ---- Difficulty gauge ---- */
  function setDifficulty(v){
    document.getElementById('fDifficulty').value = v;
    const numEl = document.getElementById('difficultyNum');
    numEl.textContent = v;
    numEl.style.color = `var(--p${v})`;
    document.querySelectorAll('.gauge-seg').forEach(el=>{
      el.classList.toggle('selected', Number(el.dataset.v) === v);
    });
    document.querySelectorAll('.gauge-num').forEach(el=>{
      el.classList.toggle('selected', Number(el.dataset.v) === v);
    });
  }
  function polarPoint(cx,cy,r,angleDeg){
    const rad = angleDeg * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
  }
  function wedgePath(cx,cy,rOuter,rInner,a0,a1){
    const o0 = polarPoint(cx,cy,rOuter,a0);
    const o1 = polarPoint(cx,cy,rOuter,a1);
    const i1 = polarPoint(cx,cy,rInner,a1);
    const i0 = polarPoint(cx,cy,rInner,a0);
    return `M ${o0.x} ${o0.y} A ${rOuter} ${rOuter} 0 0 1 ${o1.x} ${o1.y} L ${i1.x} ${i1.y} A ${rInner} ${rInner} 0 0 0 ${i0.x} ${i0.y} Z`;
  }
  function buildDifficultyGauge(){
    const svg = document.getElementById('difficultyGauge');
    const cx = 100, cy = 104, rOuter = 92, rInner = 54;
    let html = '';
    for(let v=1; v<=5; v++){
      const a0 = 180 - (v-1)*36;
      const a1 = 180 - v*36;
      const path = wedgePath(cx,cy,rOuter,rInner,a0,a1);
      const mid = polarPoint(cx,cy,(rOuter+rInner)/2,(a0+a1)/2);
      html += `<path d="${path}" class="gauge-seg" data-v="${v}" style="color:var(--p${v})"></path>`;
      html += `<text x="${mid.x}" y="${mid.y+4}" class="gauge-num" data-v="${v}">${v}</text>`;
    }
    svg.innerHTML = html;
    svg.querySelectorAll('.gauge-seg, .gauge-num').forEach(el=>{
      el.addEventListener('click', ()=> setDifficulty(Number(el.dataset.v)));
    });
  }
  buildDifficultyGauge();

  /* ---- Weekday multi-select ---- */
  function getWeeklyDaysValue(){
    return document.getElementById('fWeeklyDays').value.split(',').filter(s=>s!=='').map(Number);
  }
  function setWeeklyDaysValue(arr){
    document.getElementById('fWeeklyDays').value = arr.slice().sort((a,b)=>a-b).join(',');
    document.querySelectorAll('.weekday-btn').forEach(b=>{
      b.classList.toggle('selected', arr.includes(Number(b.dataset.day)));
    });
  }
  function toggleWeeklyDay(d){
    const arr = getWeeklyDaysValue();
    const idx = arr.indexOf(d);
    if(idx === -1) arr.push(d); else arr.splice(idx,1);
    setWeeklyDaysValue(arr.length ? arr : [new Date().getDay()]);
  }
  document.querySelectorAll('.weekday-btn').forEach(b=>{
    b.addEventListener('click', ()=> toggleWeeklyDay(Number(b.dataset.day)));
  });

  /* ---- Daily/Weekly toggle + due date visibility ---- */
  function updateDueVisibility(){
    const daily = document.getElementById('fDaily').checked;
    const weekly = document.getElementById('fWeekly').checked;
    document.getElementById('fDue').style.display = (daily || weekly) ? 'none' : 'block';
    document.getElementById('weekdayPicker').style.display = weekly ? 'flex' : 'none';
    document.getElementById('dueDateLabel').textContent = weekly ? 'Refreshes on' : 'Due date';
  }
  document.getElementById('fDaily').addEventListener('change', e=>{
    if(e.target.checked) document.getElementById('fWeekly').checked = false;
    updateDueVisibility();
  });
  document.getElementById('fWeekly').addEventListener('change', e=>{
    if(e.target.checked){
      document.getElementById('fDaily').checked = false;
      setWeeklyDaysValue([new Date().getDay()]);
    }
    updateDueVisibility();
  });

  function resetForm(){
    document.getElementById('taskInput').value = '';
    document.getElementById('notesInput').value = '';
    setPriority(3);
    setDifficulty(3);
    document.getElementById('fTime').value = 30;
    document.getElementById('fDue').value = '';
    document.getElementById('fDaily').checked = false;
    document.getElementById('fWeekly').checked = false;
    setWeeklyDaysValue([new Date().getDay()]);
    updateDueVisibility();
    document.getElementById('fTags').value = '';
    resetHoldSection();
  }
  resetForm();

  async function submitTask(){
    const input = document.getElementById('taskInput');
    const title = input.value.trim();
    const errEl = document.getElementById('addError');
    const confirmEl = document.getElementById('confirmMsg');
    const btn = document.getElementById('addBtn');
    errEl.classList.remove('show');
    confirmEl.classList.remove('show');
    if(!title){ input.focus(); return; }

    const cfg = getConfig();
    if(!cfg){ showSetup(); return; }

    const daily = document.getElementById('fDaily').checked;
    const weekly = document.getElementById('fWeekly').checked;
    const tags = document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean);

    btn.disabled = true;
    btn.textContent = 'Adding…';
    try{
      const current = await fetchTasks(cfg);
      const newTask = {
        id: 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        title,
        notes: document.getElementById('notesInput').value.trim(),
        priority: Number(document.getElementById('fPriority').value),
        difficulty: Number(document.getElementById('fDifficulty').value),
        estMinutes: Number(document.getElementById('fTime').value) || 5,
        dueDate: document.getElementById('fDue').value || null,
        daily, weekly,
        weeklyDays: getWeeklyDaysValue().length ? getWeeklyDaysValue() : [new Date().getDay()],
        tags, status: 'active', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      };
      if(document.getElementById('fStartOnHold').checked){
        let holdFields = resolveTaskHoldFields();
        if(!holdFields){
          const d = new Date(); d.setDate(d.getDate()+2);
          holdFields = { status:'onhold', holdUntil: null, holdUntilDay: localDateKey(d) };
        }
        Object.assign(newTask, holdFields);
      }
      current.push(newTask);
      await pushTasks(cfg, current);
      resetForm();
      confirmEl.classList.add('show');
      setTimeout(()=> confirmEl.classList.remove('show'), 2500);
    }catch(e){
      errEl.textContent = "Couldn't reach your Dispatch bin — check your connection and try again.";
      errEl.classList.add('show');
    }
    btn.disabled = false;
    btn.textContent = 'Add Task';
    input.focus();
  }

  document.getElementById('addBtn').addEventListener('click', submitTask);
  document.getElementById('taskInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitTask(); });

  if(getConfig()) showAdd(); else showSetup();
})();
</script>
</body>
</html>
